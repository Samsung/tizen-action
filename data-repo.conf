# Tizen Action Compiler - schema data repository
#
# actionc-sync fetches the action/entity schemas (actions/, entities/,
# action.seq) that match the tizen-action version installed on the attached
# device from this git repository, so the compiler binaries can stay as they
# are while the schemas follow the device. One KEY=VALUE per line; lines
# starting with '#' and blank lines are ignored.
#
# The repository holds one directory per tizen-action version:
#   <version>/actions/*.action
#   <version>/entities/*.entity
#   <version>/action.seq
#
# DATA_VERSION pins the tizen-action version whose schemas are installed. Leave
# it empty (or 'auto') to read the version off the attached device over sdb,
# which is the normal case; set it when building without a device or for a
# device other than the attached one. `actionc-sync --target` overrides it for
# one run.
#
# ACTIONC_DATA_REPO, ACTIONC_DATA_REPO_BRANCH and ACTIONC_DATA_VERSION in the
# environment override these values without editing this file.
#
# The schemas live on the 'data' branch of the Tizen Action repository, next to
# the toolchain on 'main', so a shallow clone of that branch fetches the schemas
# without the compiler binaries.

DATA_REPO=https://github.com/Samsung/tizen-action.git
DATA_REPO_BRANCH=data
DATA_VERSION=1.10.2

